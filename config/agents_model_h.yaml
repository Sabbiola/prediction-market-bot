# Model H (mean-reversion RSI on SOL — pure technical, no ML filter) — backtest-validated profitable strategy — uses v5 artifact as primary model.

# All other agent config is identical to agents.yaml.

# Run with:

#   python -m prediction_market_bot.main run \

#     --config config/app_model_e.yaml \

#     --agents-config config/agents_model_e.yaml



version: 2

project:

  name: prediction-market-bot-hl-h

  mode: dry-run

  venue: polymarket

  timezone: UTC

  architecture: multi-agent

  source_of_truth:

    agent_catalog: config/agents_model_e.yaml

    runtime_settings: config/app_model_e.yaml

    contracts: src/prediction_market_bot/domain/models.py



standards:

  code_language: en

  docs_language: it

  runtime_trains_models: false

  allow_direct_http_in_agents: false

  allow_business_logic_in_ui: false



thresholds:

  min_confidence: 0.10

  min_edge_bps: 30

  max_spread_bps: 400

  min_liquidity_usd: 5000

  min_volume_24h_usd: 0

  min_hours_to_resolution: 0

  btc_only_mode: true



risk:

  bankroll_usd: 1000

  taker_fee_bps: 0

  fractional_kelly: 0.50

  max_position_pct: 0.20

  max_event_bucket_pct: 0.40

  max_category_bucket_pct: 0.50

  max_portfolio_exposure_pct: 0.40

  max_per_market_exposure_pct: 0.20

  max_daily_loss_pct: 0.0

  daily_stop_loss_pct: 0.0

  max_snapshot_age_sec: 900

  global_circuit_breaker: false

  manual_pause: false

  min_bet_usd: 20

  hard_blocks:

    - confidence_below_threshold

    - edge_below_threshold

    - stake_below_min_bet

    - venue_rejected



agents:

  scanner:

    enabled: true

    owner: market-discovery

    class_path: prediction_market_bot.agents.scanner.ScanAgent

    schedule: "*/5 * * * *"

    inputs:

      - active_markets

    outputs:

      - market_candidates

    responsibilities:

      - filter_by_liquidity

      - filter_by_volume

      - filter_by_spread

      - filter_by_time_to_resolution

      - flag_price_anomalies

    forbidden:

      - place_orders

      - size_risk

      - call_llm_directly

    metrics:

      - candidates_count

      - rejection_count

      - avg_scan_score

    failure_policy:

      on_empty_feed: fail_closed

      on_partial_feed: continue_with_warning



  research:

    enabled: true

    owner: narrative-research

    class_path: prediction_market_bot.agents.research.ResearchAgent

    schedule: on_candidate

    inputs:

      - market_candidate

    outputs:

      - research_packet

    sources:

      - twitter

      - reddit

      - rss

      - official

    responsibilities:

      - collect_findings

      - score_credibility

      - compute_weighted_sentiment

      - detect_disagreement

      - produce_narrative_summary

    forbidden:

      - override_risk_policy

      - place_orders

    metrics:

      - findings_count

      - evidence_strength

      - disagreement_score

    failure_policy:

      on_source_timeout: continue_with_partial_sources

      on_no_findings: emit_empty_packet



  prediction:

    enabled: true

    owner: probabilistic-modeling

    class_path: prediction_market_bot.agents.prediction.PredictionAgent

    schedule: on_research_packet

    inputs:

      - market_candidate

      - research_packet

    outputs:

      - prediction_result

    model_family: xgboost_plus_llm

    components:

      market_weight: 0.10

      narrative_weight: 0.65

      structure_weight: 0.25

    model_inference:

      # ---- v5 model as PRIMARY (trades) ----

      engine: rsi_ml

      model_artifact_path: data/models/v5/btc_15m_best.json

      calibration_artifact_path: ""

      feature_schema_version: btc-v2-15m

      strict_feature_parity: true
      rsi_ml_rsi_low: 25.0
      rsi_ml_rsi_high: 75.0
      rsi_ml_min_prob: 0.0
      rsi_ml_edge_strength: 0.10
      rsi_ml_target_asset: SOL

      fallback_to_heuristic: true

      forced_heuristic_reason: ""

      # ---- Regime gate: empirical loss-pattern filter (G4) ----

      # Discovered from analysis of 161 historical Bot A trades.

      # Skips: trend-following with strong recent momentum (mean-reverts on 15m),

      #        trades in fp [0.45, 0.48) (low-edge / noise zone).

      regime_gate_enabled: true

      regime_gate_trend_follow_threshold: 0.003

      regime_gate_fill_price_skip_min: 0.45

      regime_gate_fill_price_skip_max: 0.48

      regime_gate_skip_extreme_rsi: false

      regime_gate_skip_bad_hours_utc: false

      alt_shadow:

        # v4 model runs as shadow-only observer

        enabled: true

        model_artifact_path: data/models/v4/btc_15m_best.json

        calibration_artifact_path: ""

        feature_schema_version: btc-v2-15m

        strict_feature_parity: true

        promoted_enabled: false

        promoted_runtime_modes: []

        required_source_coverage: []

        require_llm_enrichment: false

    responsibilities:

      - estimate_fair_probability

      - compute_edge

      - compute_confidence

      - explain_prediction

    forbidden:

      - size_bankroll

      - submit_orders

    metrics:

      - fair_yes_prob

      - edge_bps

      - confidence

    failure_policy:

      on_missing_research: continue_with_lower_confidence

      on_model_failure: fail_closed



  risk:

    enabled: true

    owner: risk-portfolio

    class_path: prediction_market_bot.agents.risk.RiskAgent

    schedule: on_prediction_result

    inputs:

      - prediction_result

      - bankroll_state

      - exposure_state

    outputs:

      - risk_decision

    responsibilities:

      - apply_fractional_kelly

      - enforce_position_caps

      - enforce_loss_limits

      - return_reason_codes

    forbidden:

      - rewrite_probabilities

      - bypass_thresholds

    metrics:

      - approved

      - stake_usd

      - kelly_fraction

    failure_policy:

      on_missing_bankroll_state: fail_closed



  execution:

    enabled: true

    owner: venue-execution

    class_path: prediction_market_bot.agents.execution.ExecutionAgent

    schedule: on_risk_decision

    inputs:

      - risk_decision

      - prediction_result

    outputs:

      - execution_result

    venue_adapter: polymarket

    responsibilities:

      - build_order_intent

      - submit_order

      - normalize_exchange_response

    forbidden:

      - change_stake_size

      - ignore_risk_block

    metrics:

      - submitted

      - filled

      - rejected

    failure_policy:

      on_rejection: emit_rejected_execution_result

      on_timeout: emit_pending_or_failed



  settlement:

    enabled: true

    owner: lifecycle-management

    class_path: prediction_market_bot.agents.settlement.SettlementAgent

    schedule: "*/10 * * * *"

    inputs:

      - open_positions

      - market_resolution_state

    outputs:

      - settled_trade

    responsibilities:

      - detect_resolution

      - compute_pnl

      - finalize_trade_record

    forbidden:

      - open_new_positions

    metrics:

      - settled_count

      - settled_pnl

    failure_policy:

      on_ambiguous_resolution: hold_for_manual_review



  postmortem:

    enabled: true

    owner: learning-memory

    class_path: prediction_market_bot.agents.postmortem.PostmortemAgent

    schedule: on_loss

    inputs:

      - settled_trade

      - prediction_result

      - research_packet

    outputs:

      - postmortem_report

    responsibilities:

      - classify_root_causes

      - create_action_items

      - tag_repeat_failures

    forbidden:

      - mutate_live_models

      - silently_change_thresholds

    metrics:

      - root_causes_count

      - action_items_count

    failure_policy:

      on_missing_context: emit_partial_postmortem


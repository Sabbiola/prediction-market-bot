# Model B (v5) configuration — separate bankroll, separate DB.
# Inherits all defaults from app.yaml except the overrides below.
# Run with:
#   python -m prediction_market_bot.main run \
#     --config config/app_model_b.yaml \
#     --agents-config config/agents_model_b.yaml
#
# This instance trades with data/runtime_v5.db and data/artifacts_v5/.
# The UI reads its positions at /api/trader/live/b.

app:
  name: prediction-market-bot-v5
  env: production
  timezone: UTC
  mode: paper
  run_loop:
    scan_interval_sec: 300
    settlement_interval_sec: 600
    max_parallel_research_jobs: 8
    max_parallel_prediction_jobs: 8

runtime:
  mode: PAPER_LIVE
  market_data_provider: AUTO
  research_provider: AUTO
  provider_failure_policy: FALLBACK_TO_STATIC

execution:
  mode: PAPER
  rehearsal_mode: PAPER
  enable_rehearsal_lane: false
  blocking_trade_review: true
  review_auto_approve: true
  review_candidate_expiry_seconds: 3600
  settlement_same_run: false

model_promotion:
  enabled: false

storage:
  operational_db:
    driver: sqlite
    path: data/runtime_v5.db
    dsn: ""
    dsn_env: ""
    backup_dir: data/backups/operational-db-v5
    auto_migrate_on_boot: true
    require_up_to_date: true
  audit_log:
    driver: file_jsonl
    path: data/audit/events_v5.jsonl
  research_store:
    driver: file_jsonl
    path: data/research/findings_v5.jsonl
  artifacts_dir: data/artifacts_v5

observability:
  log_level: INFO
  json_logs: true
  logs:
    file_path: ""
    rotate_max_bytes: 10485760
    rotate_backup_count: 5
  performance:
    enable_cli_profile: false
    slow_stage_threshold_ms: 1500
    ui_poll_cache_ttl_sec: 1.5
    ui_poll_min_interval_sec: 2.0
    include_response_timing_headers: true
  metrics:
    enabled: true
    exporter: prometheus_textfile
    path: data/metrics/metrics_v5.prom
  healthcheck:
    enabled: true
    path: /health

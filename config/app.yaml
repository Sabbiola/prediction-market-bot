app:
  name: prediction-market-bot
  env: development
  timezone: UTC
  mode: dry-run
  run_loop:
    scan_interval_sec: 300
    settlement_interval_sec: 600
    max_parallel_research_jobs: 8
    max_parallel_prediction_jobs: 8

runtime:
  mode: DRY_RUN_STATIC
  market_data_provider: AUTO
  research_provider: AUTO
  provider_failure_policy: FAIL_FAST

execution:
  mode: PAPER
  rehearsal_mode: SANDBOX_CHAIN
  enable_rehearsal_lane: true
  blocking_trade_review: true
  review_auto_approve: false
  review_candidate_expiry_seconds: 0
  settlement_same_run: false

model_promotion:
  enabled: true
  require_explicit_approval_in_live_modes: true
  required_runtime_modes:
    - PAPER_LIVE
    - SANDBOX_CHAIN
  promoted_runtime_modes:
    - SANDBOX_CHAIN
  benchmark_min_delta_brier: 0.0
  benchmark_min_delta_log_loss: 0.0
  max_calibration_error: 0.08
  max_calibration_brier_increase: 0.01
  approval_rate_min: 0.01
  approval_rate_max: 0.80
  min_edge_capture_ratio: 0.50
  min_realized_vs_expected_edge_ratio: 0.30
  max_shadow_parity_warning_rate: 0.05
  drift_reference_runs: 10
  feature_shift_warn_threshold: 0.35
  market_regime_warn_threshold: 0.30
  research_coverage_warn_threshold: 0.25
  confidence_collapse_warn_threshold: 0.20

http:
  user_agent: prediction-market-bot/0.1
  contact: ""
  timeout_sec: 8.0
  max_retries: 2
  retry_backoff_sec: 0.5
  retry_jitter_sec: 0.25
  cache_ttl_sec: 600
  openalex_api_key_env: OPENALEX_API_KEY
  enforce_allowed_hosts: false
  allowed_hosts:
    - gamma-api.polymarket.com
    - en.wikipedia.org
    - api.openalex.org
    - news.google.com
    - api.x.com
    - oauth.reddit.com
    - www.reddit.com
    - localhost
    - 127.0.0.1
  max_response_bytes: 1048576

alerting:
  enabled: false
  dedupe_window_sec: 300
  repeated_live_source_failures_threshold: 3
  webhook:
    enabled: false
    webhook_url: ""
    webhook_url_env: PM_BOT_ALERT_WEBHOOK_URL
    timeout_sec: 5.0
    max_retries: 1
    retry_backoff_sec: 0.5

live_market_data:
  enabled: false
  endpoint_url: https://gamma-api.polymarket.com/markets
  limit: 50
  max_staleness_sec: 900
  timeout_sec: 8.0
  max_retries: 2
  retry_backoff_sec: 0.5
  retry_jitter_sec: 0.25
  cache_ttl_sec: 0
  headers: {}
  api_key_env: ""
  api_key_header: Authorization
  api_key_prefix: "Bearer "
  require_api_key: false

live_research:
  enabled: false
  limit_per_source: 5
  wikipedia:
    endpoint_url: https://en.wikipedia.org/w/api.php
    timeout_sec: 8.0
    max_retries: 2
    retry_backoff_sec: 0.5
    retry_jitter_sec: 0.25
    cache_ttl_sec: 600
    headers: {}
    api_key_env: ""
    api_key_header: Authorization
    api_key_prefix: "Bearer "
    require_api_key: false
  openalex:
    endpoint_url: https://api.openalex.org/works
    timeout_sec: 8.0
    max_retries: 2
    retry_backoff_sec: 0.5
    retry_jitter_sec: 0.25
    cache_ttl_sec: 600
    headers: {}
    api_key_env: OPENALEX_API_KEY
    api_key_header: Authorization
    api_key_prefix: "Bearer "
    require_api_key: false

alt_data:
  enabled: false
  sources:
    news_rss_web:
      enabled: false
      source_class: news_rss_web
      adapter: rss_news_adapter
      endpoint_url: https://news.google.com/rss
      credential_env: ""
      capabilities:
        requires_oauth: false
        requires_user_context: false
        supports_backfill: true
        supports_live_polling: true
        supports_search: true
        supports_thread_context_expansion: false
    reddit:
      enabled: false
      source_class: reddit
      adapter: reddit_oauth_adapter
      endpoint_url: https://oauth.reddit.com
      credential_env: REDDIT_ACCESS_TOKEN
      capabilities:
        requires_oauth: true
        requires_user_context: false
        supports_backfill: true
        supports_live_polling: true
        supports_search: true
        supports_thread_context_expansion: true
    x:
      enabled: false
      source_class: x
      adapter: x_api_adapter
      endpoint_url: https://api.x.com
      credential_env: X_BEARER_TOKEN
      capabilities:
        requires_oauth: true
        requires_user_context: false
        supports_backfill: true
        supports_live_polling: true
        supports_search: true
        supports_thread_context_expansion: true

strategy_research:
  historical_data_ingest:
    base_dir: data/strategy-research
    default_dataset_id: historical-markets
    markets_endpoint_url: https://gamma-api.polymarket.com/markets
    events_endpoint_url: https://gamma-api.polymarket.com/events/{event_id}
    snapshots_endpoint_url: ""
    orderbook_endpoint_url: ""
    trades_endpoint_url: ""
    resolutions_endpoint_url: ""
    page_size: 200
    max_pages_per_run: 0
    throttle_sec: 0.2
    include_orderbook: true
    include_trades: true
  research_corpus:
    base_dir: data/strategy-research/research-corpus
    default_corpus_id: historical-research-evidence
    source_dataset_id: historical-markets
    enabled_sources:
      - wikipedia
      - openalex
    limit_per_source: 5
    throttle_sec: 0.1
    require_published_at: true
    drop_unaligned: true
  news_corpus:
    base_dir: data/strategy-research/news-corpus
    default_corpus_id: historical-news-corpus
    source_id: news_rss_web
    limit_per_query: 50
    throttle_sec: 0.1
    language: en-US
    region: US
  reddit_corpus:
    base_dir: data/strategy-research/reddit-corpus
    default_corpus_id: historical-reddit-corpus
    source_id: reddit
    limit_per_query: 50
    max_pages_per_query: 5
    include_comments: false
    comment_limit_per_post: 25
    throttle_sec: 0.1
  x_corpus:
    base_dir: data/strategy-research/x-corpus
    default_corpus_id: historical-x-corpus
    source_id: x
    limit_per_query: 50
    max_pages_per_query: 5
    auth_mode: bearer
    search_endpoint_path: /2/tweets/search/recent
    user_lookup_endpoint_path_template: /2/users/by/username/{username}
    user_posts_endpoint_path_template: /2/users/{user_id}/tweets
    throttle_sec: 0.1
  linkage:
    base_dir: data/strategy-research/linkage
    default_linkage_id: historical-evidence-linkage
    source_dataset_id: historical-markets
    news_corpus_id: historical-news-corpus
    reddit_corpus_id: historical-reddit-corpus
    x_corpus_id: historical-x-corpus
    enabled_source_classes:
      - news_rss_web
      - reddit
      - x
    max_staleness_days: 45
    similarity_threshold: 0.20
    ambiguity_margin: 0.03
    max_candidates_per_evidence: 5
    alias_map:
      united states:
        - usa
        - us
      united kingdom:
        - uk
      european union:
        - eu
  llm_enrichment:
    base_dir: data/strategy-research/llm-enrichment
    default_enrichment_id: historical-llm-enrichment
    linkage_id: historical-evidence-linkage
    news_corpus_id: historical-news-corpus
    reddit_corpus_id: historical-reddit-corpus
    x_corpus_id: historical-x-corpus
    enabled: false
    provider: deterministic
    model_id: deterministic-enrichment-v1
    prompt_version: v1
    enable_fallback: true
    allow_external_provider: false
    include_states:
      - linked
      - ambiguous
    throttle_sec: 0.0

sandbox_chain:
  enabled: false
  rpc_url: ""
  chain_id: 80002
  contract_address: ""
  from_address: ""
  intent_method_selector: "0x6e6c3d69"
  submit_tx: false
  private_key_env: SANDBOX_CHAIN_PRIVATE_KEY
  allow_unlocked_send: true
  gas_limit: 250000
  confirmations_required: 1
  dropped_after_sec: 180
  request_timeout_sec: 8.0

ui_auth:
  enabled: false
  session_secret_env: PM_BOT_UI_SESSION_SECRET
  session_timeout_sec: 1800
  cookie_name: pm_bot_ui_session
  cookie_secure: true
  cookie_samesite: lax
  require_password_hashes: false
  max_failed_attempts: 5
  lockout_seconds: 300
  users:
    - username: viewer
      role: viewer
      password_hash_env: PM_BOT_UI_VIEWER_PASSWORD_HASH
    - username: operator
      role: operator
      password_hash_env: PM_BOT_UI_OPERATOR_PASSWORD_HASH
    - username: admin
      role: admin
      password_hash_env: PM_BOT_UI_ADMIN_PASSWORD_HASH

storage:
  operational_db:
    driver: sqlite
    path: data/runtime.db
    dsn: ""
    dsn_env: OPERATIONAL_DB_DSN
    backup_dir: data/backups/operational-db
    auto_migrate_on_boot: true
    require_up_to_date: true
  audit_log:
    driver: file_jsonl
    path: data/audit/events.jsonl
  research_store:
    driver: file_jsonl
    path: data/research/findings.jsonl
  artifacts_dir: data/artifacts

scheduler:
  enabled: true
  strategy: internal-loop
  heartbeat_sec: 15
  fail_fast_on_boot_errors: true

observability:
  log_level: INFO
  json_logs: true
  logs:
    file_path: ""
    rotate_max_bytes: 10485760
    rotate_backup_count: 5
  performance:
    enable_cli_profile: false
    slow_stage_threshold_ms: 1500
    ui_poll_cache_ttl_sec: 1.5
    ui_poll_min_interval_sec: 2.0
    include_response_timing_headers: true
  metrics:
    enabled: true
    exporter: prometheus_textfile
    path: data/metrics/metrics.prom
  healthcheck:
    enabled: true
    path: /health

notifications:
  telegram:
    enabled: false
    chat_id: ""
  email:
    enabled: false
    recipients: []

# legacy source toggles kept for backward compatibility only; prefer alt_data.sources
research_sources:
  twitter:
    enabled: true
    timeout_sec: 10
    credibility_default: 0.60
  reddit:
    enabled: true
    timeout_sec: 10
    credibility_default: 0.50
  rss:
    enabled: true
    timeout_sec: 8
    credibility_default: 0.70
  official:
    enabled: true
    timeout_sec: 8
    credibility_default: 0.90

venue:
  provider: polymarket
  dry_run: true
  submit_timeout_sec: 10
  max_retries: 2
  slippage_bps_limit: 100

feature_flags:
  enable_postmortem: true
  enable_settlement: false
  enable_manual_review_queue: true
  blocking_trade_review: true
  use_live_market_data: false
  use_live_research: false
  allow_live_execution: false

security:
  secrets_from_env: true
  redact_secrets_in_logs: true
  require_explicit_live_flag: true
  secrets:
    backend: env
    command_template: ""
    command_timeout_sec: 5.0
    env_fallback: true
    # Vault backend settings (used when backend: vault)
    vault_addr_env: VAULT_ADDR           # env var holding the Vault server URL
    vault_token_env: VAULT_TOKEN         # env var holding the Vault auth token
    vault_mount: secret                  # KV v2 mount path
    vault_path_prefix: prediction-market-bot  # key prefix under the mount
    vault_timeout_sec: 5.0               # HTTP timeout for Vault API calls
  cli_auth:
    enabled: false
    actor_user_env: PM_BOT_ACTOR_USER
    actor_role_env: PM_BOT_ACTOR_ROLE

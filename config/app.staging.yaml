app:
  name: prediction-market-bot
  # NB: il profilo "staging" canonico richiede review umana bloccante
  # (vedi _check_staging_profile_requirements). Per raccolta dati continua
  # in SANDBOX_CHAIN usiamo env=staging-data-collection: stessa lane
  # sandbox-live ma senza review gate (i trade vengono eseguiti subito).
  env: staging-data-collection
  timezone: UTC
  mode: sandbox-live

# Staging profile — aligns with README "Profilo staging sandbox-live":
#   - runtime.mode=SANDBOX_CHAIN (rehearsal lane)
#   - providers live
#   - blocking trade review mandatory, no auto-approve
#   - sandbox tx lane active (submit_tx=true below)
#   - settlement separated (settlement_same_run=false)
#   - Operational DB postgres condiviso
runtime:
  mode: SANDBOX_CHAIN
  market_data_provider: LIVE
  research_provider: LIVE
  provider_failure_policy: FAIL_FAST

execution:
  mode: SANDBOX_CHAIN
  enable_rehearsal_lane: true
  # In SANDBOX_CHAIN il gate review è SEMPRE on (effective_blocking_trade_review):
  # per la lane di raccolta dati attiviamo l'auto-approve così i candidati passano
  # direttamente in execution. La review queue resta scritta per audit/postmortem.
  blocking_trade_review: true
  review_auto_approve: true
  review_candidate_expiry_seconds: 0
  settlement_same_run: false

live_market_data:
  enabled: true
  endpoint_url: https://gamma-api.polymarket.com/markets
  limit: 50
  max_staleness_sec: 900
  timeout_sec: 8.0
  max_retries: 2
  retry_backoff_sec: 0.5
  retry_jitter_sec: 0.25
  cache_ttl_sec: 0
  headers: {}
  api_key_env: ""
  api_key_header: Authorization
  api_key_prefix: "Bearer "
  require_api_key: false

live_research:
  enabled: true
  limit_per_source: 5
  wikipedia:
    endpoint_url: https://en.wikipedia.org/w/api.php
    timeout_sec: 8.0
    max_retries: 2
    retry_backoff_sec: 0.5
    retry_jitter_sec: 0.25
    cache_ttl_sec: 600
    headers: {}
    api_key_env: ""
    api_key_header: Authorization
    api_key_prefix: "Bearer "
    require_api_key: false
  openalex:
    endpoint_url: https://api.openalex.org/works
    timeout_sec: 8.0
    max_retries: 2
    retry_backoff_sec: 0.5
    retry_jitter_sec: 0.25
    cache_ttl_sec: 600
    headers: {}
    api_key_env: OPENALEX_API_KEY
    api_key_header: Authorization
    api_key_prefix: "Bearer "
    require_api_key: false

sandbox_chain:
  enabled: true
  submit_tx: true
  rpc_url: http://127.0.0.1:18545
  chain_id: 80002
  contract_address: "0x0000000000000000000000000000000000000000"
  from_address: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  private_key_env: SANDBOX_CHAIN_PRIVATE_KEY
  allow_unlocked_send: true
  gas_limit: 250000
  confirmations_required: 1
  dropped_after_sec: 180
  request_timeout_sec: 8.0

ui_auth:
  enabled: true
  session_secret_env: PM_BOT_UI_SESSION_SECRET
  session_timeout_sec: 1800
  cookie_name: pm_bot_ui_session
  cookie_secure: false
  cookie_samesite: lax
  require_password_hashes: true
  max_failed_attempts: 5
  lockout_seconds: 300
  users:
    - username: viewer
      role: viewer
      password_hash_env: PM_BOT_UI_VIEWER_PASSWORD_HASH
    - username: operator
      role: operator
      password_hash_env: PM_BOT_UI_OPERATOR_PASSWORD_HASH
    - username: admin
      role: admin
      password_hash_env: PM_BOT_UI_ADMIN_PASSWORD_HASH

storage:
  # Default staging ships with SQLite for low-friction local rehearsal.
  # To run a shared Postgres instance (recommended for team staging), override
  # `operational_db.driver: postgres` and set OPERATIONAL_DB_DSN — see README.
  operational_db:
    driver: sqlite
    path: data/staging_rehearsal.db
    dsn: ""
    dsn_env: OPERATIONAL_DB_DSN
    backup_dir: data/backups/operational-db
    auto_migrate_on_boot: true
    require_up_to_date: true
  audit_log:
    driver: file_jsonl
    path: data/audit/events.jsonl
  research_store:
    driver: file_jsonl
    path: data/research/findings.jsonl
  artifacts_dir: data/staging_artifacts

http:
  user_agent: prediction-market-bot/0.1
  contact: ""
  timeout_sec: 8.0
  max_retries: 2
  retry_backoff_sec: 0.5
  retry_jitter_sec: 0.25
  cache_ttl_sec: 600
  openalex_api_key_env: OPENALEX_API_KEY
  enforce_allowed_hosts: true
  allowed_hosts:
    - gamma-api.polymarket.com
    - en.wikipedia.org
    - api.openalex.org
    - news.google.com
    - api.x.com
    - oauth.reddit.com
    - www.reddit.com
    # BTC Up/Down enricher external sources (REC-05)
    - api.binance.com
    - fapi.binance.com
    - api.alternative.me
    - api.coinbase.com
    - api.kraken.com
    - localhost
    - 127.0.0.1
  max_response_bytes: 1048576

observability:
  log_level: INFO
  json_logs: true
  metrics:
    enabled: true
    exporter: prometheus_textfile
    path: data/metrics/metrics.prom
  healthcheck:
    enabled: true
    path: /health

feature_flags:
  enable_postmortem: true
  enable_settlement: true
  enable_manual_review_queue: true
  blocking_trade_review: true
  use_live_market_data: true
  use_live_research: true
  allow_live_execution: false

# Promuovi il modello v4 catboost (BTC 15m) in SANDBOX_CHAIN — senza questo
# il bot cade sull'euristico (fair_yes_prob ~0.47, sempre YES).
model_promotion:
  enabled: true
  require_explicit_approval_in_live_modes: false
  required_runtime_modes:
    - SANDBOX_CHAIN
  promoted_runtime_modes:
    - SANDBOX_CHAIN
  benchmark_min_delta_brier: 0.0
  benchmark_min_delta_log_loss: 0.0
  max_calibration_error: 0.50
  max_calibration_brier_increase: 0.50
  approval_rate_min: 0.0
  approval_rate_max: 1.0
  min_edge_capture_ratio: 0.0
  min_realized_vs_expected_edge_ratio: 0.0
  max_shadow_parity_warning_rate: 1.0
  drift_reference_runs: 10
  feature_shift_warn_threshold: 1.0
  market_regime_warn_threshold: 1.0
  research_coverage_warn_threshold: 1.0
  confidence_collapse_warn_threshold: 1.0

security:
  secrets_from_env: true
  redact_secrets_in_logs: true
  require_explicit_live_flag: true
  secrets:
    backend: env
    command_template: ""
    command_timeout_sec: 5.0
    env_fallback: true
  cli_auth:
    enabled: false
    actor_user_env: PM_BOT_ACTOR_USER
    actor_role_env: PM_BOT_ACTOR_ROLE

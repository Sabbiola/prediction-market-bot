{% extends "base.html" %}

{% block content %}
<section class="card" style="max-width: 520px; margin: 2rem auto;">
  <h1 style="margin-top: 0;">Operator Login</h1>
  <p style="color: #94a3b8;">Staging access requires an authenticated session.</p>
  {% if error %}
  <p class="warn" style="margin: 0.8rem 0 0;">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="actions" style="margin-top: 1rem; flex-direction: column; align-items: stretch;">
    <input type="hidden" name="next_path" value="{{ next_path or '/' }}">
    <input type="text" name="username" placeholder="username" autocomplete="username" required>
    <input type="password" name="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
  </form>
</section>
{% endblock %}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-bot-ui
  namespace: prediction-market
  labels:
    app.kubernetes.io/name: pm-bot-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: prediction-market-bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pm-bot-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pm-bot-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: prediction-market-bot
    spec:
      containers:
        - name: ui
          image: prediction-market-bot:latest
          command:
            - python
            - -m
            - prediction_market_bot.ui.server
            - --config
            - config/app.yaml
            - --agents-config
            - config/agents.yaml
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: pm-bot-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pm-bot-data

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-market-bot"
version = "0.1.0"
description = "Dry-run multi-agent foundation for prediction markets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0.12.20241230",
  "httpx>=0.27,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
research = [
  "numpy>=1.26,<3",
  "xgboost>=2.1,<3",
]

[project.scripts]
prediction-market-bot = "prediction_market_bot.main:main"
prediction-market-bot-ui = "prediction_market_bot.ui.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["prediction_market_bot*"]
exclude = [
  "legacy_reference*",
  "solana-memecoin-bot-main*",
  ".tmp_blueprint*",
  ".mypy_cache*",
  ".pytest_cache*",
  ".ruff_cache*",
  "data*",
]

[tool.setuptools.package-data]
prediction_market_bot = ["ui/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "acceptance: beta-live acceptance suite and release gate tests",
]
norecursedirs = [
  "legacy_reference",
  "solana-memecoin-bot-main",
  ".tmp_blueprint",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "data",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
